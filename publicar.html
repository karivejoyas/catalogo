<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Publicar en redes · Karivé</title>
<!-- Se abre DENTRO de Telegram, desde el botón del bot de Karivé.
     Arma las mismas fotos que el panel (logo + foto con fondo difuminado)
     y las publica en Instagram / Facebook con el publicador.
     El publicador solo acepta si Telegram firma que eres tú. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --morado: #5B2A82; --morado-prof: #3A1D4E; --dorado: #E3C572; --lila: #CFC4DF;
    --fondo: #F7F3FB; --texto: #2A1838; --suave: #6E5C80; --borde: #E2D8EC; --blanco: #fff;
    --ok: #1F8A4C; --error: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fondo: #1E1427; --texto: #F3ECF9; --suave: #BCA9CF; --borde: #3A2B49; --blanco: #2A1D36; }
  }
  :root[data-theme="dark"] { --fondo: #1E1427; --texto: #F3ECF9; --suave: #BCA9CF; --borde: #3A2B49; --blanco: #2A1D36; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--texto); }
  body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px 16px 120px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--suave); font-size: 14px; margin: 0 0 16px; }
  .fotos { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
  .foto { flex: 0 0 82%; max-width: 420px; scroll-snap-align: start; }
  .foto img { width: 100%; aspect-ratio: 1; border-radius: 14px; display: block; background: var(--borde); object-fit: cover; }
  .foto .pie { font-size: 13px; color: var(--suave); margin-top: 4px; }
  .foto.sola { flex-basis: 100%; }
  .cargando { padding: 40px 0; text-align: center; color: var(--suave); }
  label.tit { display: block; font-weight: 600; margin: 20px 0 8px; }
  textarea { width: 100%; min-height: 190px; border: 1px solid var(--borde); border-radius: 12px; padding: 12px; font: inherit; font-size: 15px; background: var(--blanco); color: var(--texto); resize: vertical; }
  .destinos { display: flex; flex-wrap: wrap; gap: 8px; }
  .destinos button { flex: 1 1 30%; min-height: 48px; border-radius: 12px; border: 2px solid var(--borde); background: var(--blanco); color: var(--texto); font: inherit; font-size: 15px; }
  .destinos button.on { border-color: var(--morado); background: var(--morado); color: #fff; font-weight: 600; }
  .estado { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 15px; display: none; }
  .estado.ver { display: block; }
  .estado.ok { background: #E6F4EC; color: var(--ok); }
  .estado.error { background: #FBE9E7; color: var(--error); }
  .estado.info { background: var(--blanco); border: 1px solid var(--borde); }
  .publicar { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); min-height: 56px; border: 0; border-radius: 16px; background: var(--morado); color: #fff; font: inherit; font-size: 18px; font-weight: 700; box-shadow: 0 6px 20px rgba(58,29,78,.35); }
  .publicar:disabled { opacity: .55; }
  .controles { margin-top: 8px; display: grid; gap: 6px; }
  .controles label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 8px; font-size: 14px; color: var(--suave); }
  .controles input[type=range] { width: 100%; height: 32px; accent-color: var(--morado); }
  .mini { display: flex; gap: 8px; margin-top: 4px; }
  .mini button, .ia button { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--borde); background: var(--blanco); color: var(--texto); font: inherit; font-size: 14px; }
  .ia { display: grid; gap: 8px; margin-top: 10px; }
  .ia .fila { display: flex; gap: 8px; }
  .ia input { flex: 1; min-width: 0; min-height: 44px; border: 1px solid var(--borde); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 15px; background: var(--blanco); color: var(--texto); }
  .ia .grande { background: var(--morado); color: #fff; border: 0; font-weight: 600; min-height: 46px; }
  .ia button:disabled { opacity: .55; }
  .aviso { background: #FFF6DB; color: #6B5100; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px; }
</style>
</head>
<body>
  <h1>📣 Publicar en redes</h1>
  <p class="sub" id="sub">Revisa cómo queda y aprieta el botón de abajo.</p>
  <div id="avisos"></div>
  <div class="fotos" id="fotos"><div class="cargando">Preparando las fotos… ⏳</div></div>

  <label class="tit" for="texto">Texto de la publicación</label>
  <textarea id="texto" placeholder="Cargando…"></textarea>
  <div class="ia">
    <button type="button" class="grande" id="ia-escribir">✨ Escribir el texto con IA</button>
    <div class="fila">
      <input id="ia-pedido" placeholder="O pídele un cambio: más corto, para el Día de la Madre…" enterkeyhint="send" />
      <button type="button" id="ia-aplicar">Aplicar</button>
    </div>
  </div>

  <label class="tit">¿Dónde lo publico?</label>
  <div class="destinos" id="destinos">
    <button type="button" data-d="ambas">Instagram y Facebook</button>
    <button type="button" data-d="ig">Solo Instagram</button>
    <button type="button" data-d="fb">Solo Facebook</button>
  </div>

  <div class="estado" id="estado"></div>
  <button type="button" class="publicar" id="publicar" disabled>🚀 Publicar</button>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js?v=20260945"></script>
<script src="comun.js?v=20260945"></script>
<script>
(function () {
  'use strict';
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); if (tg.colorScheme) document.documentElement.dataset.theme = tg.colorScheme; }
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const codigos = String(q.get('c') || '').toUpperCase().split(',').map(s => s.trim()).filter(Boolean).slice(0, 10);
  let destino = ['ambas', 'ig', 'fb'].indexOf(q.get('d')) >= 0 ? q.get('d') : 'ambas';
  let imagenes = [], prods = [], settings = {};

  function estado(msg, tipo) { const e = $('estado'); e.textContent = msg; e.className = 'estado ver ' + (tipo || 'info'); }
  function pintarDestino() {
    document.querySelectorAll('#destinos button').forEach(b => b.classList.toggle('on', b.dataset.d === destino));
    $('publicar').textContent = { ambas: '🚀 Publicar en Instagram y Facebook', ig: '🚀 Publicar en Instagram', fb: '🚀 Publicar en Facebook' }[destino];
  }
  document.querySelectorAll('#destinos button').forEach(b => b.addEventListener('click', () => { destino = b.dataset.d; pintarDestino(); }));
  pintarDestino();

  if (!tg || !tg.initData) {
    $('fotos').innerHTML = '<div class="cargando">Esta página se abre desde el bot de Karivé en Telegram.</div>';
    return;
  }
  if (!codigos.length) { $('fotos').innerHTML = '<div class="cargando">No llegó ningún producto. Vuelve al chat y pídeselo al bot de nuevo.</div>'; return; }

  async function cargar() {
    const [sdoc, ...pdocs] = await Promise.all([kvDb.collection('catalog').doc('settings').get()].concat(
      codigos.map(c => kvDb.collection('catalog').doc('products').collection('items').where('code', '==', c).limit(1).get())));
    settings = sdoc.data() || {};
    kvSetDescuento(settings);
    prods = pdocs.map(s => s.docs[0]).filter(Boolean).map(d => Object.assign({ id: d.id }, d.data()));
    const faltan = codigos.filter(c => !prods.some(p => p.code === c));
    const avisos = [];
    if (faltan.length) avisos.push('No encontré: ' + faltan.join(', '));
    const ocultos = prods.filter(p => p.stock === false).map(p => p.code);
    if (ocultos.length) avisos.push('Ojo: ' + ocultos.join(', ') + (ocultos.length > 1 ? ' están ocultos' : ' está oculto') + ' en el catálogo. Si alguien lo busca no lo va a encontrar.');
    const sinFoto = prods.filter(p => !p.photo).map(p => p.code);
    if (sinFoto.length) avisos.push('Sin foto: ' + sinFoto.join(', ') + '. No se incluyen.');
    prods = prods.filter(p => p.photo);
    $('avisos').innerHTML = avisos.map(a => '<div class="aviso">' + escapeHtml(a) + '</div>').join('');
    if (!prods.length) { $('fotos').innerHTML = '<div class="cargando">No hay fotos para publicar.</div>'; return; }

    $('sub').textContent = prods.length > 1 ? 'Se publica como carrusel de ' + prods.length + ' fotos. Desliza para verlas.' : 'Revisa cómo queda y aprieta el botón de abajo.';
    $('texto').value = kvCaptionMulti(prods, settings, kvTagsActivos(prods, settings));
    focos = prods.map(p => kvFocoIG(p));
    for (let i = 0; i < prods.length; i++) imagenes[i] = await kvGenerarPostIG(prods[i], settings, focos[i]);
    pintarFotos();
    $('publicar').disabled = false;
  }

  // ---- mover y hacer zoom a cada foto (como en el panel); se recuerda al publicar ----
  let focos = [];
  const timers = {};
  function slider(txt, campo, i, min, max) {
    return '<label>' + txt + '<input type="range" min="' + min + '" max="' + max + '" step="1" data-i="' + i + '" data-c="' + campo + '" value="' + focos[i][campo] + '" /></label>';
  }
  function pintarFotos() {
    const n = prods.length;
    $('sub').textContent = n > 1 ? 'Carrusel de ' + n + ' fotos. Desliza para verlas; con los controles mueves cada una.' : 'Con los controles de abajo puedes mover la foto y hacerle zoom.';
    $('fotos').innerHTML = prods.map((p, i) =>
      '<div class="foto' + (n === 1 ? ' sola' : '') + '"><img data-img="' + i + '" src="' + imagenes[i] + '" alt="' + escapeHtml(p.name || '') + '" />' +
      '<div class="pie">' + escapeHtml(p.code + ' · ' + (p.name || '')) + '</div>' +
      '<div class="controles">' + slider('🔍 Zoom', 'zoom', i, 100, 260) + slider('↔️ Lados', 'x', i, 0, 100) + slider('↕️ Altura', 'y', i, 0, 100) + '</div>' +
      '<div class="mini"><button type="button" data-centrar="' + i + '">Centrar</button>' +
      (n > 1 ? '<button type="button" data-quitar="' + i + '">Quitar esta foto</button>' : '') + '</div></div>').join('');
    $('fotos').querySelectorAll('input[type=range]').forEach(r => r.addEventListener('input', e => {
      const i = +e.target.dataset.i;
      focos[i][e.target.dataset.c] = +e.target.value;
      clearTimeout(timers[i]);
      timers[i] = setTimeout(async () => {
        imagenes[i] = await kvGenerarPostIG(prods[i], settings, focos[i]);
        const img = $('fotos').querySelector('img[data-img="' + i + '"]'); if (img) img.src = imagenes[i];
      }, 60);
    }));
    $('fotos').querySelectorAll('[data-centrar]').forEach(b => b.addEventListener('click', async () => {
      const i = +b.dataset.centrar;
      focos[i] = { x: 50, y: 50, zoom: 100 };
      imagenes[i] = await kvGenerarPostIG(prods[i], settings, focos[i]);
      pintarFotos();
    }));
    $('fotos').querySelectorAll('[data-quitar]').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.quitar;
      prods.splice(i, 1); imagenes.splice(i, 1); focos.splice(i, 1);
      pintarFotos();
    }));
  }

  // ---- texto con IA (lo hace el publicador: Gemini mira las fotos, NVIDIA escribe) ----
  function miniatura(src, max) {
    return kvCargarImagen(src).then(img => {
      if (!img) return null;
      const c = document.createElement('canvas'), s = Math.min(1, max / Math.max(img.width, img.height));
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL('image/jpeg', 0.8).split(',')[1];
    });
  }
  async function pedirIA(cuerpo, boton) {
    const url = String(settings.igPubUrl || '').trim();
    if (!url) { estado('Falta la dirección del publicador en el panel.', 'error'); return null; }
    const btns = [$('ia-escribir'), $('ia-aplicar')];
    btns.forEach(b => b.disabled = true);
    const txt = boton.textContent; boton.textContent = '✨ Pensando…';
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ accion: 'tg-ia', initData: tg.initData,
          productos: prods.map(p => ({ nombre: p.name, coleccion: kvCat(p.category, settings).nombre, medida: p.detail || '' })) }, cuerpo)) });
      const d = await r.json();
      if (!d || !d.ok) { estado('❌ ' + ((d && d.error) || 'La IA no respondió.'), 'error'); return null; }
      $('estado').className = 'estado';
      return d.texto;
    } catch (err) { estado('❌ No me pude conectar: ' + err.message, 'error'); return null; }
    finally { btns.forEach(b => b.disabled = false); boton.textContent = txt; }
  }
  $('ia-escribir').addEventListener('click', async () => {
    if (!prods.length) return;
    const imgs = [];
    for (const p of prods.slice(0, 4)) { const b = await miniatura(p.photo, 512); if (b) imgs.push(b); }
    const t = await pedirIA({ tipo: 'ig-texto', imagenes: imgs, tags: kvTagsActivos(prods, settings).join(' ') }, $('ia-escribir'));
    if (t) $('texto').value = t;
  });
  async function aplicarPedido() {
    const pedido = $('ia-pedido').value.trim();
    if (!pedido) { estado('Escribe qué quieres cambiar, por ejemplo: "hazlo más corto".', 'info'); return; }
    const t = await pedirIA({ tipo: 'ig-pedido', actual: $('texto').value, pedido: pedido }, $('ia-aplicar'));
    if (t) { $('texto').value = t; $('ia-pedido').value = ''; }
  }
  $('ia-aplicar').addEventListener('click', aplicarPedido);
  $('ia-pedido').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); aplicarPedido(); } });

  $('publicar').addEventListener('click', async () => {
    const url = String(settings.igPubUrl || '').trim();
    if (!url) { estado('Falta la dirección del publicador en el panel.', 'error'); return; }
    if (!$('texto').value.trim()) { estado('Escribe un texto para la publicación.', 'error'); return; }
    $('publicar').disabled = true;
    estado('Publicando… no cierres esta pantalla. Tarda más o menos ' + (15 + prods.length * 7) + ' segundos ⏳', 'info');
    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    try {
      const r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'tg-publicar', initData: tg.initData, destino: destino, caption: $('texto').value,
                               codigos: prods.map(p => p.code), images: imagenes.map(u => u.split(',')[1]),
                               encuadres: prods.map((p, i) => ({ id: p.id, codigo: p.code, x: focos[i].x, y: focos[i].y, zoom: focos[i].zoom })) })
      });
      const d = await r.json();
      if (d && d.ok) {
        const donde = [d.ig === 'ok' ? 'Instagram' : null, d.fb === 'ok' ? 'Facebook' : null].filter(Boolean).join(' y ');
        estado('✅ ¡Publicado en ' + (donde || 'tus redes') + '!' + (d.aviso ? ' ' + d.aviso : ''), 'ok');
        $('publicar').textContent = '✅ Publicado';
        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        setTimeout(() => tg.close(), 2500);
      } else {
        estado('❌ ' + ((d && d.error) || 'No se pudo publicar.'), 'error');
        $('publicar').disabled = false;
      }
    } catch (err) {
      estado('❌ No me pude conectar con el publicador: ' + err.message, 'error');
      $('publicar').disabled = false;
    }
  });

  cargar().catch(err => { console.error(err); $('fotos').innerHTML = '<div class="cargando">⚠ No pude cargar los productos: ' + escapeHtml(err.message) + '</div>'; });
})();
</script>
</body>
</html>
